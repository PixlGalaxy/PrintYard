name: Build and Push Docker Image for PrintYard

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  release:
    types: [created]
  # Run by hand from the Actions tab.
  workflow_dispatch:

# Read-only by default; the docker job asks for packages: write on its own.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, tests and the frontend build run first: a red test never builds an image.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🟢 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 🧪 Backend (typecheck + tests)
        working-directory: backend
        run: npm ci && npm run typecheck && npm test

      - name: 🧪 Frontend (lint + build)
        working-directory: frontend
        run: npm ci && npm run lint && npm run build

  # Keep the job name "docker": together with "test" it is the required check
  # Dependabot's auto-merge waits for.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚀 Display Startup Message
        run: echo "🚀 Hello from Galaxy! | Building the PrintYard container (frontend + backend + slicer runtime)..."

      - name: 📂 Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔍 Prepare Repository Owner and Version
        run: |
          echo "REPOSITORY_OWNER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME=printyard" >> $GITHUB_ENV
          echo "APP_VERSION=$(node -p "require('./backend/package.json').version")" >> $GITHUB_ENV
          echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: 🏷 Derive Image Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.APP_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 only: the Creality Print engine is published for x86_64 only.
      # Build once and load it locally so it can be smoke-tested before anything is pushed.
      - name: 🏗 Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: printyard:ci
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}-${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must boot, run its migrations and answer /api/health.
      - name: 🩺 Smoke Test the Image
        run: |
          docker run -d --name sd-smoke --memory 2g printyard:ci
          for i in $(seq 1 30); do
            if docker exec sd-smoke wget -qO- http://127.0.0.1:3000/api/health; then
              echo; echo "Healthy after $((i * 2)) s"; docker rm -f sd-smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          docker logs sd-smoke
          exit 1

      # Pull requests (Dependabot included) only build and test, so nothing unreviewed reaches the registry.
      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}-${{ env.SHA_SHORT }}
          cache-from: type=gha

      # Values reach the script as env vars, not ${{ }} (APP_VERSION comes from package.json).
      - name: ✅ Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### PrintYard image" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`$APP_VERSION-$SHA_SHORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
